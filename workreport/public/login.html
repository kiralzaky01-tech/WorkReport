<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - WorkReport</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="auth-page">


    <div class="auth-card">

        <div class="auth-logo">

            <h1>WorkReport</h1>

            <p>
                Sistem Laporan Kerja
            </p>

        </div>


        <h2>
            Login
        </h2>


        <p class="auth-description">
            Masuk ke akun WorkReport kamu.
        </p>


        <form id="loginForm">


            <div class="input-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="nama@email.com"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-primary full"
            >
                Login
            </button>


        </form>


        <p
            id="message"
            class="message"
        ></p>


        <p class="auth-footer">

            Belum memiliki akun?

            <a href="register.html">
                Daftar
            </a>

        </p>


    </div>


    <script
        type="module"
        src="js/auth.js"
    ></script>

</body>

</html>
